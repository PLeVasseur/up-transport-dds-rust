[package]
name = "up-transport-dds"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Dust DDS RTPS transport families for Eclipse uProtocol"
readme = "README.md"
repository = "https://github.com/PLeVasseur/up-transport-dds-rust"
include = [
    "/.cargo/**",
    "/.github/**",
    "/benches/**",
    "/docs/**",
    "/idl/**",
    "/src/**",
    "/tests/**",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/deny.toml",
]

[dependencies]
async-trait = "0.1.88"
bytes = "1.11.1"
clap = { version = "4.5.41", features = ["derive"] }
dust_dds = "=0.16.0"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
up-rust = { version = "=0.10.0-SNAPSHOT", git = "https://github.com/PLeVasseur/up-rust.git", rev = "4c786f83fd03f22ba4e7a4e9af0846ae79ecf852", default-features = false, features = ["owned-frame-transport", "protobuf-wire", "selected-wire-user-api", "transport-implementer-api", "wire-implementer-api", "zero-copy-transport"] }
up-wire-arrow = { version = "0.1.0", git = "https://github.com/PLeVasseur/up-wire-arrow-rust.git", rev = "c1205767f542cfcbfaa4fc75218c23487e9af9c3" }
up-wire-omgidl = { version = "0.1.0", git = "https://github.com/PLeVasseur/up-wire-omgidl-rust.git", rev = "253f7fee3603a6440850e9cd198a027b5fc3bd89" }
up-wire-xcdrv2 = { version = "=0.0.0", git = "https://github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "4887f808dd8d91e8d033ca13e10da4cce6e4a521" }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "transport_criterion"
harness = false

[[bin]]
name = "dds_publisher"
path = "src/bin/dds_publisher.rs"

[[bin]]
name = "dds_subscriber"
path = "src/bin/dds_subscriber.rs"

[[bin]]
name = "dds_notifier"
path = "src/bin/dds_notifier.rs"

[[bin]]
name = "dds_notifyee"
path = "src/bin/dds_notifyee.rs"

[[bin]]
name = "dds_client"
path = "src/bin/dds_client.rs"

[[bin]]
name = "dds_server"
path = "src/bin/dds_server.rs"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
