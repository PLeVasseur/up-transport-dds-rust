[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0", # borrow-or-share, used by the SDK's fluent-uri parser
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/PLeVasseur/up-rust.git",
    "https://github.com/PLeVasseur/up-wire-arrow-rust.git",
    "https://github.com/PLeVasseur/up-wire-omgidl-rust.git",
    "https://github.com/PLeVasseur/up-wire-xcdrv2-rust.git",
]
